# This is a basic workflow to help you get started with Actions

name: Git Node Package Find Test

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "develop" branch
  pull_request:
    branches: 
    - develop

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  git-node-package-find-test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: pr 브랜치 체크아웃
        uses: actions/checkout@v4
        with:
          # pr head commit으로 checkout
          ref: ${{ github.event.pull_request.head.sha }}
          
      - name: node 설치
        uses: actions/setup-node@v4
        with:
          #노드 버전 (환경변수에 저장해놔야 함)
          node-version: ${{vars.node-version || 'latest'}}
        
      - name: node 버전 출력
        run: echo $(node --version)
      
      - name: build 시도
        id: build
        env:
          BUILD_SCRIPT: ${{vars.build-script}}
        
      # 절대 경로로 찾기
      # 경로로 이동하기
      # ci로 종속성 설치 및 빌드 (환경변수에 없으면, npm run build 시도, 실패해도 중단하지 않음)
        run: |
          build_script=${BUILD_SCRIPT:-build}
          
          package_jsons=$(find "$(pwd)" -name package.json)
          if [ -z "$package_jsons" ]; then
            echo "NO_PACKAGE_JSON=true" >> $GITHUB_OUTPUT
            echo "package.json 파일을 찾을 수 없습니다."
          else
            all_success="success"
            each_results=""

            set +e
            while IFS= read -r package_json
            do
              build_result="success"
              
              dir=$(dirname "$package_json")
              echo "처리 중: $dir"
              cd "$dir"
              
              echo "== 종속성 설치 =="
              if ! npm ci; then
                echo "npm ci 실패, npm install을 시도합니다"
                if ! npm install; then
                  echo "npm install 실패"
                  build_result="fail"
                fi
              fi

              echo "== 프로젝트 빌드 =="
              if ! npm run $build_script; then
                build_result="fail"
              fi

              if  [ "$build_result"="success" ]; then
                echo "프로젝트 빌드 성공"
                each_results+="$dir: success\n"
              else
                echo "프로젝트 빌드 실패"
                each_results+="$dir: fail\n"
                all_success="fail"
              fi
            done <<< "$package_jsons"

            # 결과를 steps.build에 저장 - 다른 곳에서 사용 가능
            echo "OVERALL_BUILD_RESULT=${all_success}" >> $GITHUB_OUTPUT
            {
              # 여러줄 저장 (EOF 사용)
              echo "EACH_BUILD_RESULTS<<EOF"
              echo "$each_results"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
          
              
      # https://octokit.github.io/rest.js/v21/#pulls 를 따릅니다
      - name: Comment PR
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const buildResult = '${{ steps.build.outputs.OVERALL_BUILD_RESULT }}';
            const eachResults= '${{ steps.build.outputs.EACH_BUILD_RESULTS }}';
            const output = `
            #### 빌드 테스트 결과: ${buildResult}
            ${eachResults}
            `;
            const reviewResult = buildResult === "success" ? 'APPROVE' : 'REQUEST_CHANGES';
            
            github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: reviewResult,
              body: output
            }); 
