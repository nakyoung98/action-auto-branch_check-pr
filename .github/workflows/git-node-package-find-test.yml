# This is a basic workflow to help you get started with Actions

name: Git Node Package Find Test

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "develop" branch
  pull_request:
    branches: 
    - develop

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  git-node-package-find-test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: pr 브랜치 체크아웃
        uses: actions/checkout@v4
        with:
          # pr head commit으로 checkout
          ref: ${{ github.event.pull_request.head.sha }}
          
      - name: node 설치
        uses: actions/setup-node@v4
        with:
          #노드 버전 (환경변수에 저장해놔야 함)
          node-version: ${{vars.node-version || 'latest'}}
        
      - name: node 버전 출력
        run: echo $(node --version)
      
      - name: package.json 파일 찾기
        env:
          BUILD_SCRIPT: ${{vars.build-script}}
        
      # 절대 경로로 찾기
      # 경로로 이동하기
      # 종속성 설치 및 빌드 (환경변수에 없으면, npm run build 시도, 실패해도 중단하지 않음)
        run: |
          find -name package.json -exec sh -c '
            dir=$(dirname "$1")
            cd $dir
            echo "== 종속성 설치 =="
            npm install
            echo "== 빌드 =="
            npm run $BUILD_SCRIPT || npm run build || true
            ' sh {} \;
